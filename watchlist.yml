# watch-radar watchlist
# One entry per watch you are tracking. Edit freely; the routine re-reads this file every run.
# The four entries below are EXAMPLES chosen by Claude on 2 Nov 2026 so the first runs produce real output.
# Replace them with the references you actually care about.
#
# Fields:
#   id          short slug, used as the key in data/ files — keep it stable once set
#   brand/model/reference   what to search for; add `aliases` for nicknames and alternate reference spellings
#   condition   list of acceptable conditions: new | unworn | excellent | good | fair
#   full_set    true = only report listings with box AND papers; false = any
#   ceiling     highest price worth reporting, in `currency` (listings above it are logged for price history but not emailed)
#   markets     worldwide | au | eu | us | uk  (where the seller is; shipping to Australia is assumed)
#   notes       anything the agent should know (dial variants, years, what to avoid)

defaults:
  currency: AUD
  markets: [worldwide]
  home_country: Australia

watches:
  - id: rolex-126610ln
    brand: Rolex
    model: Submariner Date
    reference: 126610LN
    aliases: ["126610 LN", "Submariner 41 black"]
    condition: [unworn, excellent]
    full_set: true
    ceiling: 15000
    notes: Example entry. Post-2020 41 mm black-dial Submariner Date.

  - id: omega-speedmaster-hesalite
    brand: Omega
    model: Speedmaster Moonwatch Professional
    reference: 310.30.42.50.01.001
    aliases: ["3861 Hesalite", "Moonwatch Hesalite", "310.30.42.50.01.001"]
    condition: [new, unworn, excellent]
    full_set: false
    ceiling: 8500
    notes: Example entry. Hesalite crystal, calibre 3861, steel bracelet.

  - id: tudor-bb58-79030n
    brand: Tudor
    model: Black Bay Fifty-Eight
    reference: 79030N
    aliases: ["BB58 black", "Black Bay 58"]
    condition: [unworn, excellent, good]
    full_set: false
    ceiling: 4500
    notes: Example entry. Black/gilt dial on steel bracelet preferred over fabric strap.

  - id: cartier-santos-medium-wssa0029
    brand: Cartier
    model: Santos de Cartier Medium
    reference: WSSA0029
    aliases: ["Santos medium steel", "WSSA0029"]
    condition: [unworn, excellent]
    full_set: true
    ceiling: 9000
    notes: Example entry. Steel, silvered dial, with both bracelet and leather strap if possible.
